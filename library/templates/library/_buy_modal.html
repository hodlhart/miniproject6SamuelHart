<div class="modal fade" id="buyModal-{{ card.pk }}" tabindex="-1"
     aria-labelledby="buyModalLabel-{{ card.pk }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="buyModalLabel-{{ card.pk }}">
          Buy {{ card.name }}?
        </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>
          {{ card.name }} from {{ card.set_name }} costs
          <strong>{{ card.price_chapters }} chapters</strong>.
        </p>
        <p class="mb-0">
          {{ reader.username }} has <strong>{{ balance }} chapters</strong>.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <form method="post" action="{% url 'library:buy_card' reader.pk card.pk %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-primary">Buy</button>
        </form>
      </div>
    </div>
  </div>
</div>
