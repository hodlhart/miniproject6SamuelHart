<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pages for Pokemon{% endblock %}</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #1f2328;
      background: #f6f8fa;
    }
    main {
      max-width: 60rem;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    h1 {
      margin-top: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #d0d7de;
      text-align: left;
    }
    th {
      background: #eaeef2;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .card {
      flex: 1 1 12rem;
      padding: 1rem;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    .card img {
      display: block;
      max-width: 100%;
      height: auto;
      margin-bottom: 0.5rem;
    }
    .card h3 {
      margin: 0 0 0.25rem;
    }
    .price {
      font-weight: 600;
    }
    .muted {
      color: #57606a;
    }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
